# CareSync HCMS - Production Docker Compose Stack
# Reference: Phase 25 Production Hardening Specification

services:
  postgres:
    image: postgres:16-alpine
    container_name: caresync-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${CARESYNC_DB_NAME:-caresync}
      POSTGRES_USER: ${CARESYNC_DB_USER:-caresync}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - caresync_prod_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CARESYNC_DB_USER:-caresync} -d ${CARESYNC_DB_NAME:-caresync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - caresync_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${CARESYNC_BACKEND_IMAGE:-caresync-backend:latest}
    container_name: caresync-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CARESYNC_DB_NAME:-caresync}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${CARESYNC_DB_USER:-caresync}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Required}
      CARESYNC_JWT_SECRET: ${CARESYNC_JWT_SECRET:?Required}
      CARESYNC_CORS_ORIGINS: ${CARESYNC_CORS_ORIGINS:-https://hospital.caresync.health}
      CARESYNC_ADMIN_EMAIL: ${CARESYNC_ADMIN_EMAIL:-admin@hospital.caresync.health}
      CARESYNC_ADMIN_PASSWORD: ${CARESYNC_ADMIN_PASSWORD:?Required}
      CARESYNC_RECEPTIONIST_EMAIL: ${CARESYNC_RECEPTIONIST_EMAIL:-frontdesk@hospital.caresync.health}
      CARESYNC_RECEPTIONIST_PASSWORD: ${CARESYNC_RECEPTIONIST_PASSWORD:?Required}
      CARESYNC_FORWARD_HEADERS_STRATEGY: native
      CARESYNC_TRUSTED_PROXIES: "10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - caresync_internal

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: caresync-nginx-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/caresync.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - caresync_internal

volumes:
  caresync_prod_pgdata:

networks:
  caresync_internal:
    driver: bridge
