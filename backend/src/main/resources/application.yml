spring:
  application:
    name: hcms
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/caresync}
    username: ${SPRING_DATASOURCE_USERNAME:caresync}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

caresync:
  jwt:
    secret: ${CARESYNC_JWT_SECRET}
    access-token-expiry-seconds: 900
    refresh-token-expiry-seconds: 604800
  cors:
    allowed-origins: ${CARESYNC_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    register-per-minute: 5
    login-per-minute: 10
    refresh-per-minute: 20
    board-per-minute: 30
  reporting:
    time-zone: Asia/Kolkata
  bootstrap:
    admin:
      email: ${CARESYNC_ADMIN_EMAIL:admin@caresync.local}
      password: ${CARESYNC_ADMIN_PASSWORD:}
    receptionist:
      email: ${CARESYNC_RECEPTIONIST_EMAIL:reception@caresync.local}
      password: ${CARESYNC_RECEPTIONIST_PASSWORD:}
    demo:
      doctor-password: ${CARESYNC_DEMO_DOCTOR_PASSWORD:}
      patient-password: ${CARESYNC_DEMO_PATIENT_PASSWORD:}
