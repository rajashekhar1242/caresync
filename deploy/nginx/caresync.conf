# CareSync Hospital Management System (HCMS)
# Production Nginx Reverse Proxy & TLS Hardening Configuration
# Reference: Phase 25.1 Specification (Same-Origin Routing)

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream cluster to Spring Boot backend
upstream backend_cluster {
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# HTTP Server (Port 80)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hospital.caresync.health;

    # ACME Challenge Directory for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS (preserves request URI and query parameters)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS Server (Port 443) - Same-Origin Frontend, REST API & WebSocket
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hospital.caresync.health;

    # SSL / TLS Modern Ciphers & Protocol Standards (TLSv1.2 & TLSv1.3 only)
    ssl_certificate /etc/letsencrypt/live/hospital.caresync.health/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hospital.caresync.health/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Session caching and tickets
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling (active when Let's Encrypt chain.pem is present)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/hospital.caresync.health/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Root Directory for React Production Build (Vite output: /dist)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Global security headers inclusion at server level
    include /etc/nginx/snippets/security-headers.conf;

    # --------------------------------------------------------------------------
    # 1. Frontend Static Assets (Immutable Fingerprinted Chunks)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # Static SVG favicon in root
    location = /vite.svg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 2. Single Page Application (SPA) Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --------------------------------------------------------------------------
    # 3. REST API Proxy to Spring Boot Backend
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Upstream keepalive connection reuse
        proxy_set_header Connection "";

        # Standard trusted forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Preserve client authorization header
        proxy_pass_header Authorization;

        # Request body limits (10MB sufficient for clinic documents/records)
        client_max_body_size 10M;

        # Timeouts for REST API operations
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Proxy buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        # Pass backend error bodies through intact
        proxy_intercept_errors off;

        include /etc/nginx/snippets/security-headers.conf;
    }

    # --------------------------------------------------------------------------
    # 4. WebSocket STOMP Endpoint Proxying (/ws/**)
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Dynamic upgrade headers via map
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for low-latency STOMP push
        proxy_buffering off;

        # Extended timeouts for persistent queue subscriptions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        include /etc/nginx/snippets/security-headers.conf;
    }

    # --------------------------------------------------------------------------
    # 5. Actuator Endpoint Protection
    # --------------------------------------------------------------------------
    # Spring Boot Actuator endpoints are strictly internal
    # Container health checks probe http://localhost:8080/actuator/health/liveness directly
    location /actuator {
        return 404;
    }
    
}
