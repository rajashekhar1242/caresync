# CareSync HCMS - Production Security Headers Snippet
# Included at server level and within every location block that defines custom headers
# to guarantee full header inheritance across all routes and responses.

# Conservative initial HSTS: 6 months (15,724,800 seconds) with subdomains; preload omitted until verified permanent
add_header Strict-Transport-Security "max-age=15724800; includeSubDomains" always;

# Clickjacking defense: Deny all iframe embedding
add_header X-Frame-Options "DENY" always;

# MIME type sniffing defense
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy: Send full URL for same-origin, only origin on cross-origin HTTPS, no referrer on downgrade
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy: Disable unused browser device capabilities
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy: Restrictive directives aligned with React 18, Vite 6, and Google Fonts
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
